services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-formwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-formwise}
      POSTGRES_DB: ${POSTGRES_DB:-formwise}
    volumes:
      - formwise_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-formwise} -d ${POSTGRES_DB:-formwise}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - formwise

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8002"
      DATABASE_URL: postgresql://${POSTGRES_USER:-formwise}:${POSTGRES_PASSWORD:-formwise}@postgres:5432/${POSTGRES_DB:-formwise}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      SEED_IF_EMPTY: ${SEED_IF_EMPTY:-true}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    networks:
      - formwise

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
      - "${WEB_DEV_PORT:-5175}:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - formwise

volumes:
  formwise_pgdata:

networks:
  formwise:
    driver: bridge
