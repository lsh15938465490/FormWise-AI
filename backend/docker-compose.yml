# 仅本地开发：在宿主机跑前后端时起数据库（Postgres 映射 5433）。
# 云服务器请用仓库根目录 docker-compose.yml。
services:
  postgres:
    image: postgres:16-alpine
    container_name: formwise-postgres
    environment:
      POSTGRES_USER: formwise
      POSTGRES_PASSWORD: formwise
      POSTGRES_DB: formwise
    ports:
      - "5433:5432"
    volumes:
      - formwise_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formwise -d formwise"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: formwise-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  formwise_pgdata:
